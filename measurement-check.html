<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="analytics-validation" content="true"><title>計測接続検証</title></head><body><h1>計測接続検証</h1><p>運営者による合成テスト専用です。商品・需要・成約実績ではありません。Umamiへ検証イベントのみ送信します。</p><button id="usage">合成利用イベントを送信</button><button id="click">合成外部クリックを送信</button><output id="status"></output><script type="module">import {measure} from './measurement.mjs';document.getElementById('usage').onclick=()=>{measure('tool_usage');document.getElementById('status').textContent='検証用利用イベントを送信';};document.getElementById('click').onclick=()=>{measure('outbound_click','synthetic-test','affiliate');document.getElementById('status').textContent='検証用クリックイベントを送信（実広告クリックなし）';};</script></body></html>
